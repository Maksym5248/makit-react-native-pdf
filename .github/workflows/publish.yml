name: Publish npm package
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release version and reviewed branch
        shell: bash
        run: |
          node -e 'const p = require("./package.json"); if (p.name !== "@makit-kit/react-native-pdf" || !/^\d+\.\d+\.\d+$/.test(p.version) || process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Release tag must match the stable package version");'
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
      - name: Pack and publish the release archive
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          npm pack --pack-destination "$RUNNER_TEMP/npm-release"
          npm publish "$RUNNER_TEMP/npm-release/"*.tgz --access public
