# Run only on an existing Ammo-E2E / Ammo_E2E device, with APP_ID set explicitly.
appId: ${APP_ID}
---
- launchApp
- tapOn: "(?i)Sample PDF"
- extendedWaitUntil:
    visible: "1 / 3"
    timeout: 15000
- tapOn: "(?i)Search"
- tapOn: "(?i)Search PDF"
- inputText: "alpha"
- extendedWaitUntil:
    visible: "6 matches in.*"
    timeout: 15000
- hideKeyboard
- tapOn: "(?i)Match →"
- assertVisible: "1/6"
- tapOn: "(?i)Match →"
- assertVisible: "2/6"
- tapOn: "(?i)← Match"
- assertVisible: "1/6"
- tapOn: "(?i)Hide"
- tapOn: "(?i)Pages"
- tapOn: "(?i)Page 3"
- assertVisible: "3 / 3"
- tapOn: "(?i)View"
- assertVisible: "3 / 3"
- assertVisible: ".*file rotation 90°.*"
- tapOn: "(?i)Horizontal"
- tapOn: "(?i)Paging"
- tapOn: "(?i)Rotation 0°"
- assertVisible: "(?i)Rotation 90°"
- tapOn: "(?i)Fit width"
- assertVisible: "(?i)Fit page"
- assertVisible: "3 / 3"
- tapOn: "(?i)Hide"
- tapOn: "(?i)Pages"
- tapOn: "(?i)Page 1"
- assertVisible: "1 / 3"
- tapOn: "(?i)View"
- tapOn: "(?i)Horizontal"
- tapOn: "(?i)Paging"
- tapOn: "(?i)Hide"
- tapOn: "(?i)File"
- tapOn: "(?i)Close"
- assertVisible: "Document closed"
- tapOn: "(?i)Sample PDF"
- extendedWaitUntil:
    visible: "1 / 3"
    timeout: 15000
